function niceMaterialName(id){
  return String(id || 'material').replace(/[_-]+/g,' ').replace(/\b\w/g,m=>m.toUpperCase());
}
function materialFromPair(id, topKey, fillKey){
  return {id, name:niceMaterialName(id).toUpperCase(), sub:'External sprite pair', top:topKey, fill:fillKey,
    accent:'#d8d8d8', friction:0.88, slide:0.14, upCost:1.65, downPush:0.18};
}
function addAssetFile(assetFiles, key, file){
  if(!key || !file || assetFiles[key]) return;
  assetFiles[key]=file;
}
function detectMaterialPairsFromFiles(assetFiles, fileNames){
  const byStem=new Map();
  for(const file of fileNames){
    const clean=file.split('/').pop();
    const m=clean.match(/^(.+?)(?:[_-])?(top|fill)\.(png|jpg|jpeg|webp)$/i) || clean.match(/^(.+?)(1|2)\.(png|jpg|jpeg|webp)$/i);
    if(!m) continue;
    const id=m[1].replace(/[^a-z0-9_-]+/ig,'_').replace(/^_+|_+$/g,'').toLowerCase();
    const kind=(m[2].toLowerCase()==='top'||m[2]==='1')?'top':'fill';
    if(!byStem.has(id)) byStem.set(id,{});
    byStem.get(id)[kind]=clean;
  }
  const found=[];
  for(const [id,pair] of byStem){
    if(!pair.top || !pair.fill) continue;
    const topKey=`${id}_top`;
    const fillKey=`${id}_fill`;
    addAssetFile(assetFiles, topKey, pair.top);
    addAssetFile(assetFiles, fillKey, pair.fill);
    found.push(materialFromPair(id, topKey, fillKey));
  }
  return found;
}
function parseDirectoryListing(html){
  const files=[];
  const re=/href=["']([^"']+)["']/ig;
  let m;
  while((m=re.exec(html))){
    const href=decodeURIComponent(m[1]).split('?')[0].split('#')[0];
    if(/\.(png|jpg|jpeg|webp)$/i.test(href) && !href.includes('/')) files.push(href);
  }
  return files;
}

async function readExternalManifest(assetFiles){
  // Avstängt med flit. Lokal file:// får inte fetch:a mappar/manifest säkert.
  return {materials:[]};
}
async function discoverRootSprites(assetFiles){
  // Avstängt med flit. Använd LADDA SPRITE-MAPP.

function loadImage(key, src){
  return new Promise(resolve=>{
    const im=new Image();
    im.onload=()=>{loaded++; imgs[key]=im; resolve();};
    im.onerror=()=>{loadingError+='\nKunde inte ladda '+key+': '+src; loaded++; resolve();};
    im.src=src;
  });
}
function normalizeMaterials(list, assetFiles){
  const out=[];
  const seen=new Set();
  for(const m of list){
    if(!m || !m.top || !m.fill || !assetFiles[m.top] || !assetFiles[m.fill]) continue;
    const id=m.id || `${m.top}_${m.fill}`;
    if(seen.has(id)) continue;
    seen.add(id);
    out.push({...materialFromPair(id,m.top,m.fill), ...m});
  }
  return out;
}

function clearDynamicAssetUrls(){
  for(const url of dynamicAssetUrls){
    try{ URL.revokeObjectURL(url); }catch(err){}
  }
  dynamicAssetUrls=[];
}
function detectLumoSpritesFromFileObjects(files){
  const found={};
  for(const file of files){
    const clean=(file.name || '').split('/').pop().toLowerCase();
    if(!/\.(png|jpg|jpeg|webp)$/i.test(clean)) continue;

    // Primära namn:
    // lumo_idle.png / lumo-idle.png / lumo idle.png
    // lumo_walk.png / lumo-walk.png / lumo walk.png
    // Extra snäll fallback: idle.png och walk.png funkar också.
    if(/(^|[_\-\s])lumo[_\-\s]*idle\.(png|jpg|jpeg|webp)$/i.test(clean) || /^idle\.(png|jpg|jpeg|webp)$/i.test(clean)){
      found.lumo_idle=file;
    }
    if(/(^|[_\-\s])lumo[_\-\s]*walk\.(png|jpg|jpeg|webp)$/i.test(clean) || /^walk\.(png|jpg|jpeg|webp)$/i.test(clean)){
      found.lumo_walk=file;
    }
  }
  return found;
}
function detectMaterialPairsFromFileObjects(files){
  const byStem=new Map();
  for(const file of files){
    const clean=(file.name || '').split('/').pop();
    const lower=clean.toLowerCase();
    // Lumo-sprites ska inte tolkas som materialpar.
    if(lower.includes('lumo') || lower==='idle.png' || lower==='walk.png') continue;
    const m=clean.match(/^(.+?)(?:[_-])?(top|fill)\.(png|jpg|jpeg|webp)$/i) || clean.match(/^(.+?)(1|2)\.(png|jpg|jpeg|webp)$/i);
    if(!m) continue;
    const id=m[1].replace(/[^a-z0-9_-]+/ig,'_').replace(/^_+|_+$/g,'').toLowerCase();
    const kind=(m[2].toLowerCase()==='top'||m[2]==='1')?'top':'fill';
    if(!byStem.has(id)) byStem.set(id,{});
    byStem.get(id)[kind]=file;
  }
  const assetFiles={};
  const found=[];
  clearDynamicAssetUrls();

  const lumo=detectLumoSpritesFromFileObjects(files);
  for(const [key,file] of Object.entries(lumo)){
    const url=URL.createObjectURL(file);
    dynamicAssetUrls.push(url);
    assetFiles[key]=url;
  }

  for(const [id,pair] of byStem){
    if(!pair.top || !pair.fill) continue;
    const topKey=`${id}_top`;
    const fillKey=`${id}_fill`;
    const topUrl=URL.createObjectURL(pair.top);
    const fillUrl=URL.createObjectURL(pair.fill);
    dynamicAssetUrls.push(topUrl, fillUrl);
    assetFiles[topKey]=topUrl;
    assetFiles[fillKey]=fillUrl;
    found.push(materialFromPair(id, topKey, fillKey));
  }
  return {assetFiles, materials:found, lumo};
}
async function applyFolderFiles(files){
  const list=Array.from(files || []).filter(f=>/\.(png|jpg|jpeg|webp)$/i.test(f.name || ''));
  const detected=detectMaterialPairsFromFileObjects(list);
  const hasLumo=!!(detected.lumo && (detected.lumo.lumo_idle || detected.lumo.lumo_walk));
  if(!detected.materials.length && !hasLumo){
    folderStatus='Hittade inga materialpar eller Lumo-sprites. Material: namn_top.png + namn_fill.png eller namn1.png + namn2.png. Lumo: lumo_idle.png + lumo_walk.png';
    return;
  }
  loaded=0;
  loadingError='';
  const oldSelectedMat=mats.length ? (selectedThing==='platform' ? platforms[selectedPlatform].mat : bridgeMats[selectedBridge]) : 0;
  mats=normalizeMaterials(detected.materials, detected.assetFiles);
  await Promise.all(Object.entries(detected.assetFiles).map(([k,src])=>loadImage(k,src)));
  const maxIndex=Math.max(0,mats.length-1);
  for(const p of platforms) p.mat=clamp(p.mat,0,maxIndex);
  bridgeMats=bridgeMats.map(v=>clamp(v,0,maxIndex));
  materialPage=Math.floor(clamp(oldSelectedMat,0,maxIndex)/MATERIALS_PER_PAGE);
  const lumoText=`Lumo idle:${imgs.lumo_idle?'JA':'NEJ'} walk:${imgs.lumo_walk?'JA':'NEJ'}`;
  folderStatus=`Laddade ${detected.materials.length} materialpar. ${lumoText}`;
  invalidateWorldCache();
  resetPlayer();
}
async function chooseSpriteFolder(){
  try{
    if(window.showDirectoryPicker){
      const dir=await window.showDirectoryPicker();
      const files=[];
      for await (const entry of dir.values()){
        if(entry.kind==='file' && /\.(png|jpg|jpeg|webp)$/i.test(entry.name)) files.push(await entry.getFile());
      }
      await applyFolderFiles(files);
      return;
    }
  }catch(err){
    if(err && err.name==='AbortError') return;
    folderStatus='Kunde inte läsa mappen: '+(err.message||err);
    return;
  }
  const input=document.createElement('input');
  input.type='file';
  input.multiple=true;
  input.accept='.png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp';
  input.webkitdirectory=true;
  input.style.display='none';
  document.body.appendChild(input);
  input.onchange=async()=>{
    await applyFolderFiles(input.files);
    input.remove();
  };
  input.click();
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function invLerp(a,b,v){return clamp((v-a)/(b-a),0,1)}
function rnd(n){return Math.abs(Math.sin(n*127.17+seed*313.91)*43758.5453)%1}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function getMat(i){return mats.length ? mats[clamp(i,0,mats.length-1)] : null;}
function hasLoadedMaterial(mat){return !!(mat && imgs[mat.top] && imgs[mat.fill]);}

function materialKind(mat){
  const text=String([mat?.id,mat?.name,mat?.top,mat?.fill].join(' ')).toLowerCase();
  if(/(^|[^a-z])(ice|is|frost|glacier|snow|frozen)([^a-z]|$)/.test(text) || text.includes('ice_blue')) return 'ice';
  if(text.includes('grass')) return 'grass';
  if(text.includes('crystal')) return 'crystal';
  if(text.includes('crust') || text.includes('lava') || text.includes('magma')) return 'crust';
  if(text.includes('marmor') || text.includes('marble')) return 'marmor';
  if(text.includes('rock') || text.includes('stone') || text.includes('cave')) return 'rock';
  return mat?.id || 'material';
}
function isIceMat(mat){ return materialKind(mat)==='ice'; }
function isGrassMat(mat){ return materialKind(mat)==='grass'; }

function drawMissingMaterialBlock(x,y,w,h){
  ctx.save();
  rr(x,y,w,h,4);ctx.clip();
  ctx.fillStyle='#273033';ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#344044';
  for(let yy=y;yy<y+h;yy+=TILE)for(let xx=x;xx<x+w;xx+=TILE){if(((xx+yy)/TILE)&1)ctx.fillRect(xx,yy,TILE,TILE)}
  ctx.strokeStyle='rgba(246,209,29,.45)';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1);
  ctx.restore();
}
function drawLumoFallback(){
  ctx.save();ctx.translate(player.x,player.y+34);
  ctx.fillStyle='#f7b52c';ctx.beginPath();ctx.roundRect(-11,-34,22,34,7);ctx.fill();
  ctx.fillStyle='#ffd766';ctx.beginPath();ctx.arc(0,-38,10,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function ew(){return TILE*5}
function platformW(i){return TILE*Math.round(platforms[i]?.wTiles||5)}
function platformLayout(){
  const uiH=showUI?316:20;
  const totalW=(platforms[2].xTiles-platforms[0].xTiles)*TILE + platformW(2);
  const startX=Math.round((W-totalW)/2);
  const baseY=Math.round((H-uiH)/2-42);
  return platforms.map((p,i)=>({left:startX+p.xTiles*TILE, right:startX+p.xTiles*TILE+platformW(i), y:baseY+p.y, mat:p.mat, w:platformW(i)}));
}
function bridgeSegments(){
  const ps=platformLayout();
  return [
    {i:0,x0:ps[0].right,y0:ps[0].y,x1:ps[1].left,y1:ps[1].y,mat:bridgeMats[0]},
    {i:1,x0:ps[1].right,y0:ps[1].y,x1:ps[2].left,y1:ps[2].y,mat:bridgeMats[1]}
  ];
}
function surfaceYInSeg(seg,x){
  const w=Math.max(1,seg.x1-seg.x0);
  const q=clamp((x-seg.x0)/w,0,1);
  let y=lerp(seg.y0,seg.y1,q)+Math.sin(q*Math.PI)*settings.curve*TILE*2.1;
  y+=(Math.sin(q*17+seed+seg.i*3)*7 + Math.sin(q*39+seg.i)*3.5 + (rnd(Math.floor(q*90)+seg.i*80)-0.5)*4)*settings.rough;
  return y;
}
function segmentAt(x){
  const segs=bridgeSegments();
  if(x>=segs[0].x0 && x<=segs[0].x1)return segs[0];
  if(x>=segs[1].x0 && x<=segs[1].x1)return segs[1];
  return null;
}
function platformAt(x){
  const ps=platformLayout();
  for(let i=0;i<ps.length;i++) if(x>=ps[i].left && x<=ps[i].right) return i;
  return -1;
}
function groundY(x){
  const ps=platformLayout(), seg=segmentAt(x);
  if(seg)return surfaceYInSeg(seg,x);
  const pi=platformAt(x);
  if(pi>=0)return ps[pi].y;
  if(x<ps[0].left)return ps[0].y;
  if(x>ps[2].right)return ps[2].y;
  // tiny gaps should resolve to nearest end height
  let best=ps[0],bd=1e9;
  for(const p of ps){const d=Math.min(Math.abs(x-p.left),Math.abs(x-p.right)); if(d<bd){bd=d;best=p;}}
  return best.y;
}
function matAt(x){
  const seg=segmentAt(x); if(seg)return seg.mat;
  const pi=platformAt(x); if(pi>=0)return platforms[pi].mat;
  return platforms[0].mat;
}
function bridgePhysicsAt(x){
  const seg=segmentAt(x);
  if(!seg)return {gravity:1,uphill:1,downhill:1,slide:1,grip:1};
  return bridgePhysics[seg.i] || {gravity:1,uphill:1,downhill:1,slide:1,grip:1};
}

function slopeAt(x){
  const seg=segmentAt(x);
  if(!seg)return 0;
  const dx=8;
  return clamp((groundY(x+dx)-groundY(x-dx))/(dx*2),-1.25,1.25);
}
function bg(){
  ctx.fillStyle='#11171a';ctx.fillRect(0,0,W,H);
  for(let y=0;y<H;y+=TILE)for(let x=0;x<W;x+=TILE){
    ctx.fillStyle=((x/TILE+y/TILE)&1)?'rgba(255,255,255,.025)':'rgba(0,0,0,.12)';
    ctx.fillRect(x,y,TILE,TILE);
  }
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(0,0,W,H);
}
function drawSpriteCrop(im,x,y,w,h,sx=0,sy=0,sw=im.width,sh=im.height){
  ctx.save();rr(x,y,w,h,3);ctx.clip();ctx.drawImage(im,sx,sy,sw,sh,x,y,w,h);ctx.restore();
}
function drawSpriteCropTiled(im,x,y,w,h,sx=0,sy=0,sw=im.width,sh=im.height){
  ctx.save();
  rr(x,y,w,h,3);
  ctx.clip();

  // True tile repeat:
  // draw whole 24x24 destination cells, never stretch a sprite over a larger area.
  const cols=Math.max(1,Math.round(w/TILE));
  const rows=Math.max(1,Math.ceil(h/TILE));

  for(let cy=0;cy<rows;cy++){
    for(let cx=0;cx<cols;cx++){
      const dx=x+cx*TILE;
      const dy=y+cy*TILE;
      ctx.drawImage(im,sx,sy,sw,sh,dx,dy,TILE,TILE);
    }
  }

  ctx.restore();
}

function drawPlatform(idx){
  const ps=platformLayout(), p=ps[idx], mat=getMat(p.mat);
  if(!hasLoadedMaterial(mat)){drawMissingMaterialBlock(p.left,p.y,p.w,settings.topH+TILE*settings.fillTiles);return;}
  const top=imgs[mat.top], fill=imgs[mat.fill];
  const topCropH=Math.max(1,top.height*0.45);
  const fillSy=mat.id==='grass'?Math.floor(top.height*0.36):0;
  const fillSh=mat.id==='grass'?Math.floor(top.height*0.64):fill.height;
  drawSpriteCropTiled(top,p.left,p.y,p.w,settings.topH,0,0,top.width,top.height);
  drawSpriteCropTiled(fill,p.left,p.y+settings.topH,p.w,TILE*settings.fillTiles,0,0,fill.width,fill.height);
  if(labMode==='edit'){
    const active=selectedThing==='platform'&&selectedPlatform===idx;
    if(active&&showUI){
      ctx.strokeStyle='rgba(246,209,29,.9)';ctx.lineWidth=2;
      ctx.strokeRect(p.left-2,p.y-2,p.w+4,settings.topH+TILE*settings.fillTiles+4);
    }
    // Small draggable handle so the platform feels editable, not just selectable.
    const hx=p.left+p.w/2, hy=p.y-14;
    ctx.save();
    ctx.fillStyle=active?'rgba(246,209,29,.95)':'rgba(255,255,255,.42)';
    ctx.strokeStyle='rgba(0,0,0,.45)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.arc(hx,hy,5,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
}
function drawBridge(seg){
  if(seg.x1<=seg.x0+2)return;
  const mat=getMat(seg.mat);
  if(!hasLoadedMaterial(mat)){drawMissingMaterialBlock(seg.x0,Math.min(seg.y0,seg.y1),seg.x1-seg.x0,settings.topH+TILE*settings.fillTiles);return;}
  const top=imgs[mat.top], fill=imgs[mat.fill], sw=settings.sliceW, w=seg.x1-seg.x0;

  ctx.imageSmoothingEnabled=false;

  /*
    Bridge scale fix:
    Use the same 24px material scale as platform tiles.
    Each vertical slice samples from a repeating 24x24 destination-cell pattern.
    The bridge is still fake-bent by moving each slice vertically along the curve,
    but the texture no longer has its own larger/smaller scale.
  */
  for(let x=seg.x0;x<seg.x1;x+=sw){
    const y=Math.round(surfaceYInSeg(seg,x));
    const localX=x-seg.x0;
    const cellX=((Math.floor(localX)%TILE)+TILE)%TILE;
    const topSrcX=Math.floor((cellX/TILE)*top.width);
    const fillSrcX=Math.floor((cellX/TILE)*fill.width);
    const topSrcW=Math.max(1,Math.ceil((sw/TILE)*top.width));
    const fillSrcW=Math.max(1,Math.ceil((sw/TILE)*fill.width));

    // Top row: one 24px-tile-height band, same proportions as platform top cells.
    ctx.drawImage(
      top,
      topSrcX,0,
      Math.min(topSrcW,top.width-topSrcX),top.height,
      Math.floor(x),y,
      sw,settings.topH
    );

    // Fill rows: repeated 24px rows, not one stretched fill block.
    const rows=Math.max(1,Math.round(settings.fillTiles));
    for(let r=0;r<rows;r++){
      const dy=y+settings.topH+r*TILE;
      ctx.drawImage(
        fill,
        fillSrcX,0,
        Math.min(fillSrcW,fill.width-fillSrcX),fill.height,
        Math.floor(x),dy,
        sw,TILE
      );
    }
  }

  ctx.imageSmoothingEnabled=true;
  polish(seg,mat);
  drawMaterialFx(seg,mat);
}
function polish(seg,mat){
  const p=settings.polish;
  ctx.beginPath();
  for(let i=0;i<=120;i++){const x=lerp(seg.x0,seg.x1,i/120),y=surfaceYInSeg(seg,x)+1;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
  ctx.strokeStyle=isIceMat(mat)?`rgba(255,255,255,${0.35+0.45*p})`:isGrassMat(mat)?`rgba(205,255,58,${0.22+0.45*p})`:`rgba(255,220,145,${0.18+0.38*p})`;
  ctx.lineWidth=isIceMat(mat)?2+p*2:1.5+p*2;ctx.stroke();
  if(isGrassMat(mat)){
    for(let i=0;i<Math.floor(60+135*p);i++){const q=rnd(i+2+seg.i*100),x=lerp(seg.x0,seg.x1,q),y=surfaceYInSeg(seg,x)+rnd(i+3)*10;

function drawMaterialFx(seg,mat){
  if(!seg || !mat)return;
  const w=seg.x1-seg.x0;
  if(w<=2)return;

  ctx.save();

  if(mat.id==='crystal'){
    // Irregular short-lived sparkles. No marching line.
    ctx.globalCompositeOperation='screen';
    for(let i=0;i<16;i++){
      const base=rnd(i*91+seg.i*37);
      const life=(effectTime*0.55 + base*3.7) % 1;
      const flicker=Math.sin(life*Math.PI);
      if(flicker<=0.05)continue;

      const anchorQ=rnd(i*17+seg.i*103);
      const wobX=(Math.sin(effectTime*(1.1+rnd(i)*1.9)+i*2.31))*8*rnd(i+4);
      const wobY=(Math.cos(effectTime*(1.3+rnd(i+2)*2.2)+i*1.71))*6*rnd(i+9);
      const x=lerp(seg.x0,seg.x1,anchorQ)+wobX;
      const y=surfaceYInSeg(seg,x)+settings.topH+8+rnd(i+seg.i*19)*TILE*settings.fillTiles*.62+wobY;

      const a=0.10+flicker*.28;
      const r=1.5+flicker*3.2*rnd(i+8);
      ctx.fillStyle=`rgba(30,235,255,${a})`;
      ctx.beginPath();
      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fill();

      ctx.strokeStyle=`rgba(80,245,255,${a*.9})`;
      ctx.lineWidth=1;
      ctx.beginPath();
      const ang=rnd(i+11)*Math.PI*2;
      const len=5+flicker*10;
      ctx.moveTo(x-Math.cos(ang)*len,y-Math.sin(ang)*len);
      ctx.lineTo(x+Math.cos(ang)*len,y+Math.sin(ang)*len);
      ctx.moveTo(x-Math.cos(ang+Math.PI/2)*len*.65,y-Math.sin(ang+Math.PI/2)*len*.65);
      ctx.lineTo(x+Math.cos(ang+Math.PI/2)*len*.65,y+Math.sin(ang+Math.PI/2)*len*.65);
      ctx.stroke();
    }
  }

  if(materialKind(mat)==='crust'){
    // Soft glowing heat pockets for lava/crust only. Ice uses the sprite texture itself, no extra streak overlays.
    ctx.globalCompositeOperation='screen';
    const cold=false;
    for(let i=0;i<18;i++){
      const q=rnd(i+seg.i*77);
      const x=lerp(seg.x0,seg.x1,q);
      const y=surfaceYInSeg(seg,x)+settings.topH+8+rnd(i+9)*TILE*settings.fillTiles*.68;
      const glow=.30+.35*Math.sin(effectTime*(cold?1.7:3.0)+i);
      const rx=cold ? 8+rnd(i)*16 : 10+rnd(i)*22;
      const ry=cold ? 3+rnd(i+2)*7 : 2+rnd(i+2)*5;
      ctx.fillStyle=cold
        ? `rgba(70,220,255,${0.035+glow*.065})`
        : `rgba(255,75,10,${0.08+glow*.12})`;
      ctx.beginPath();
      ctx.ellipse(x,y,rx,ry,rnd(i+4)*Math.PI,0,Math.PI*2);
      ctx.fill();

      ctx.strokeStyle=cold
        ? `rgba(170,245,255,${0.025+glow*.045})`
        : `rgba(255,120,20,${0.05+glow*.10})`;
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(x-rx*.7,y);
      ctx.lineTo(x+rx*.7,y+(rnd(i+6)-.5)*5);
      ctx.stroke();
    }
  }

  if(materialKind(mat)==='marmor'){
    ctx.globalAlpha=.18;
    ctx.strokeStyle='rgba(255,255,255,.34)';
    ctx.lineWidth=1;
    for(let i=0;i<5;i++){
      const q=rnd(i+144);
      let x=lerp(seg.x0,seg.x1,q);
      let y=surfaceYInSeg(seg,x)+settings.topH+8+rnd(i)*TILE*settings.fillTiles*.6;
      ctx.beginPath();
      ctx.moveTo(x,y);
      for(let j=0;j<3;j++){
        x+=18+rnd(i*j+5)*35;
        y+=(rnd(i*j+9)-.5)*18;
        ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
  }

  ctx.restore();
}

function updatePlayer(dt){
  const ps=platformLayout();
  const left=keys.arrowleft||keys.d;
  const right=keys.arrowright||keys.f;
  const boost=keys[' '];

  player.input=!!(left||right);

  const inputDir = right ? 1 : left ? -1 : 0;
  if(inputDir) player.dir=inputDir;

  const matIndex = matAt(player.x);
  const mat = getMat(matIndex) || {id:'grass',friction:0.86,slide:0.10,upCost:1.8,downPush:0.18};
  const slope = slopeAt(player.x);
  const bp = bridgePhysicsAt(player.x);
  const steep = Math.min(1, Math.abs(slope));

  player.slope = slope;
  player.mat = matIndex;

  // Slope physics v2:
  // X beräknas först, Y snappar till marken efteråt.
  // Uppför bromsar, nedför hjälper kontrollerat, is glider utan input.
  const isIce = isIceMat(mat);
  const uphillForInput = inputDir !== 0 && Math.sign(slope) === -inputDir;
  const downhillForInput = inputDir !== 0 && Math.sign(slope) === inputDir;

  let accel = 470;
  let maxSpeed = isIce ? (boost ? 275 : 185) : (boost ? 215 : 138);

  if(settings.slopePhysics){
    if(uphillForInput){
      const uphillPenalty = clamp(steep * (isIce ? 1.95 : 1.35) * bp.uphill, 0, boost ? 0.58 : 0.86);
      accel *= (1 - uphillPenalty);
      maxSpeed *= (1 - clamp(steep * 0.52, 0, boost ? 0.20 : 0.42));
    } else if(downhillForInput){
      accel *= (1 + steep * (isIce ? 0.46 : 0.13) * bp.downhill);
      maxSpeed *= (1 + steep * 0.18);
    }
  }

  if(boost){
    accel *= 1.9 * (settings.boostPower || 1);
    maxSpeed *= 1.25;
    player.boostT=.12;
  }

  if(inputDir){
    player.vx += inputDir * accel * dt;
  }

  if(player.on && settings.slopePhysics){
    const downhillDir = slope > 0 ? 1 : slope < 0 ? -1 : 0;
    if(downhillDir){
      const slideAmount = steep * steep;
      const naturalSlide = (isIce ? 520 : 45) * bp.gravity * bp.slide;

      if(isIce || inputDir === downhillDir){
        player.vx += downhillDir * naturalSlide * slideAmount * dt;
      }

      const movingUphill = Math.sign(player.vx) === -downhillDir;
      if(movingUphill && !boost){
        const brake = Math.max(0.72, 1 - steep * (isIce ? 0.28 : 0.22));
        player.vx *= Math.pow(brake, dt*60);
      }
    }
  }

  if(!player.input){
    player.vx *= Math.pow(isIce ? (1-0.004*bp.grip) : (1-0.16*bp.grip), dt*60);
  } else {
    player.vx *= Math.pow(isIce ? (1-0.002*bp.grip) : (1-0.015*bp.grip), dt*60);
  }

  player.vx = clamp(player.vx, -maxSpeed, maxSpeed);

  player.x += player.vx*dt;
  player.x = clamp(player.x, ps[0].left+12, ps[2].right-12);

  const gy = groundY(player.x)-34;

  if(player.on){
    player.y = gy;
    player.vy = 0;
  } else {
    player.vy += 900*dt;
    player.y += player.vy*dt;
    if(player.y>gy){
      player.y=gy;
      player.vy=0;
      player.on=true;
    }
  }

  if(keys.a && player.on){
    player.vy=-430;
    player.on=false;
    keys.a=false;
  }

  if(player.input)player.walkT+=dt;
  if(player.boostT>0)player.boostT-=dt;
}

  const q=invLerp(min,max,v);
  ctx.fillStyle='#dbe2e5';ctx.font='12px system-ui';ctx.fillText(label,x,y);
  ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+128,y-4);ctx.lineTo(x+128+w,y-4);ctx.stroke();
  ctx.fillStyle='#ddd7cc';ctx.beginPath();ctx.arc(x+128+w*q,y-4,5,0,7);ctx.fill();
  rr(x+128+w+14,y-19,50,24,4);ctx.fillStyle='rgba(255,255,255,.045)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.08)';ctx.stroke();
  ctx.fillStyle='#dbe2e5';ctx.fillText(text,x+128+w+27,y);
  addRect('slider',x+128,y-12,w,18,{key,min,max});
}
function checkbox(x,y,on,label,sub){ctx.strokeStyle='rgba(255,255,255,.22)';ctx.strokeRect(x,y,14,14);if(on){ctx.fillStyle='#f6d11d';ctx.fillRect(x+3,y+3,8,8)}ctx.fillStyle='#e8edf2';ctx.font='12px system-ui';ctx.fillText(label,x+24,y+12);if(sub){ctx.fillStyle='#8e979b';ctx.font='11px system-ui';ctx.fillText(sub,x+24,y+30)}}
function controls(y){rr(12,y,W-24,46,4);ctx.fillStyle='rgba(17,23,25,.72)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.15)';ctx.stroke();ctx.fillStyle='#f6d11d';ctx.font='bold 13px system-ui';ctx.fillText('KONTROLLER',30,y+28);const a=[['←/→','gå'],['A','hoppa'],['SPACE','boost'],['1 2 3','plattform'],['4 5','bro'],['R','reset'],['H','UI'],['C','collision']];let x=150;for(const it of a){ctx.fillStyle='#e8edf2';ctx.font='bold 12px system-ui';ctx.fillText(it[0],x,y+28);ctx.fillStyle='#b8c0c4';ctx.font='12px system-ui';ctx.fillText(it[1],x+(it[0].length>4?58:48),y+28);x+=it[0].length>4?135:108;}}

function platformHitAt(pt){
  const ps=platformLayout();
  const h=settings.topH + TILE*settings.fillTiles;
  for(let i=ps.length-1;i>=0;i--){
    const p=ps[i];
    if(pt.x>=p.left && pt.x<=p.right && pt.y>=p.y-10 && pt.y<=p.y+h+10){
      return i;
    }
  }
  return -1;
}
function startWorldPlatformDrag(pt){
  const idx=platformHitAt(pt);
  if(idx<0)return false;
  selectedThing='platform';
  selectedPlatform=idx;
  const ps=platformLayout();
  worldDrag={
    platform:idx,
    startX:pt.x,
    startY:pt.y,
    startXTiles:platforms[idx].xTiles,
    startYValue:platforms[idx].y
  };
  return true;
}
function applyWorldPlatformDrag(pt){
  if(!worldDrag)return;
  const idx=worldDrag.platform;
  const dxTiles=Math.round((pt.x-worldDrag.startX)/TILE);
  const dy=Math.round(pt.y-worldDrag.startY);

  // P1 stays as the left anchor in this lab, so drag it vertically only.
  if(idx!==0){
    let newX=worldDrag.startXTiles+dxTiles;
    if(idx===1)newX=clamp(newX,platforms[0].xTiles+6,platforms[2].xTiles-6);
    if(idx===2)newX=clamp(newX,platforms[1].xTiles+6,60);
    platforms[idx].xTiles=newX;
  }

  platforms[idx].y=clamp(worldDrag.startYValue+dy,-130,130);
}
function pointer(e){const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
function hit(pt,r){return pt.x>=r.x&&pt.x<=r.x+r.w&&pt.y>=r.y&&pt.y<=r.y+r.h}
function setValue(key,v){
  invalidateWorldCache();
  if(key==='p0y')platforms[0].y=v;
  else if(key==='p1y')platforms[1].y=v;
  else if(key==='p2y')platforms[2].y=v;
  else if(key==='p1x')platforms[1].xTiles=Math.min(v,platforms[2].xTiles-6);
  else if(key==='p2x')platforms[2].xTiles=Math.max(v,platforms[1].xTiles+6);
  else if(key==='p0w')platforms[0].wTiles=v;
  else if(key==='p1w')platforms[1].wTiles=v;
  else if(key==='p2w')platforms[2].wTiles=v;
  else if(key.startsWith('bp')){
    const prop=key.slice(2).toLowerCase();
    bridgePhysics[selectedBridge][prop]=v;
  }
  else settings[key]=v;
}
function applySlider(pt){
  if(!drag)return;
  const q=clamp((pt.x-drag.x)/drag.w,0,1),d=drag.data;
  let v=lerp(d.min,d.max,q);
  if(['p0y','p1y','p2y','p1x','p2x','p0w','p1w','p2w','sliceW','topH','fillTiles'].includes(d.key))v=Math.round(v);
  setValue(d.key,v);
}
canvas.addEventListener('mousedown',e=>{
  if(labMode!=='edit')return;
  const pt=pointer(e);

  if(showUI){
    for(const r of uiRects){
      if(hit(pt,r)){
        if(r.kind==='selectThing'){
          selectedThing=r.data.kind;
          if(r.data.kind==='platform')selectedPlatform=r.data.idx;
          else selectedBridge=r.data.idx;
          return;
        }
        if(r.kind==='mat'){
          if(selectedThing==='platform')platforms[selectedPlatform].mat=r.data.i;
          else bridgeMats[selectedBridge]=r.data.i;
          invalidateWorldCache();
          return;
        }
        if(r.kind==='folder'){chooseSpriteFolder();return;}
        if(r.kind==='matPagePrev'){materialPage=Math.max(0,materialPage-1);return;}
        if(r.kind==='matPageNext'){materialPage=Math.min(Math.ceil(mats.length/MATERIALS_PER_PAGE)-1,materialPage+1);return;}
        if(r.kind==='toggleSlope'){settings.slopePhysics=settings.slopePhysics?0:1;return;}
        if(r.kind==='toggleCollision'){showCollision=!showCollision;return;}
        if(r.kind==='toggleGuides'){showGuides=!showGuides;return;}
        if(r.kind==='slider'){drag=r;applySlider(pt);return;}
      }
    }
  }

  startWorldPlatformDrag(pt);
});
addEventListener('mousemove',e=>{const pt=pointer(e);if(drag)applySlider(pt);if(worldDrag){applyWorldPlatformDrag(pt);invalidateWorldCache();}});
addEventListener('mouseup',()=>{drag=null;worldDrag=null;});

function drawPlayBadge(){
  if(labMode!=='play') return;
  rr(14,14,230,42,6);
  ctx.fillStyle='rgba(8,12,14,.74)';
  ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.18)';
  ctx.stroke();
  ctx.fillStyle='#f6d11d';
  ctx.font='bold 13px system-ui';
  ctx.fillText('PLAY MODE',28,31);
  ctx.fillStyle='#dce4e7';
  ctx.font='12px system-ui';
  ctx.fillText('cached world · TAB till Edit',108,31);
}

function buildWorldCacheKey(){
  return JSON.stringify({
    W,H,DPR,TILE,
    settings:{
      curve:settings.curve,
      rough:settings.rough,
      sliceW:settings.sliceW,
      topH:settings.topH,
      fillTiles:settings.fillTiles,
      polish:settings.polish
    },
    platforms,
    bridgeMats,
    bridgePhysics
  });
}
function invalidateWorldCache(){
  playWorldCache=null;
  playWorldCacheKey='';
}
function renderStaticWorldToCache(){
  const key=buildWorldCacheKey();
  if(playWorldCache && playWorldCacheKey===key)return;

  playWorldCacheKey=key;
  playWorldCache=document.createElement('canvas');
  playWorldCache.width=Math.max(1,Math.ceil(W*DPR));
  playWorldCache.height=Math.max(1,Math.ceil(H*DPR));

  const oldCtx=ctx;
  const cacheCtx=playWorldCache.getContext('2d');
  cacheCtx.setTransform(DPR,0,0,DPR,0,0);

  ctx=cacheCtx;
  bg();
  drawWorld();
  ctx=oldCtx;
}

function loop(ts){
  const dt=Math.min(.033,(ts-last)/1000||.016);last=ts;effectTime+=dt;
  updatePlayer(dt);
  if(labMode==='play'){
    renderStaticWorldToCache();
    ctx.fillStyle='#11171a';
    ctx.fillRect(0,0,W,H);
    ctx.drawImage(playWorldCache,0,0,W,H);
  } else {
    bg();
    drawWorld();
  }
  drawLumo();
  drawPlayBadge();
  drawUI();
  requestAnimationFrame(loop);
}
