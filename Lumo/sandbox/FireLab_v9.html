<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FireLab v9</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,Segoe UI,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}.panel{position:fixed;left:16px;top:16px;width:326px;max-height:calc(100vh - 32px);overflow:auto;padding:14px 14px 12px;color:#fff;background:rgba(10,10,12,.86);border:1px solid rgba(255,255,255,.10);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.55);backdrop-filter:blur(12px)}h1{margin:0 0 10px;font-size:18px;letter-spacing:.2px}.presetbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}button{border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.07);color:#fff;border-radius:10px;padding:8px 9px;font-weight:650;cursor:pointer}button:hover{background:rgba(255,130,35,.18)}button.active{background:rgba(255,120,35,.32);border-color:rgba(255,180,80,.35)}.row{margin:10px 0 12px}.row label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:rgba(255,255,255,.86)}.row output{font-variant-numeric:tabular-nums;color:#ffcf82}input[type=range]{width:100%;accent-color:#ff8b2e}.note{font-size:11px;line-height:1.35;color:rgba(255,255,255,.55);margin-top:8px}.sep{height:1px;background:rgba(255,255,255,.08);margin:12px 0}.tiny{font-size:11px;color:rgba(255,255,255,.62)}
</style>
</head>
<body>
<canvas id="fire"></canvas>
<div class="panel">
  <h1>🔥 FireLab v9</h1>
  <div class="tiny">Bredare eld, färgvariation per låga och mindre vit blockig bas.</div>
  <div class="presetbar">
    <button data-preset="campfire" class="active">Brasa</button>
    <button data-preset="torch">Fackla</button>
    <button data-preset="candle">Stearinljus</button>
    <button data-preset="gas">Gasollampa</button>
  </div>
  <div id="controls"></div>
  <div class="sep"></div>
  <button id="randomize" style="width:100%">Ny organisk variant</button>
  <div class="note">Tips: öka Basbredd + Antal lågor för bred brasa. Dra ner Core white om basen blir för vit.</div>
</div>
<script>
(() => {
'use strict';
const canvas = document.getElementById('fire');
const ctx = canvas.getContext('2d', { alpha:false });
const DPR = Math.min(2, window.devicePixelRatio || 1);
let W=0,H=0;
function resize(){ W=Math.floor(innerWidth*DPR); H=Math.floor(innerHeight*DPR); canvas.width=W; canvas.height=H; canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); W=innerWidth; H=innerHeight; }
addEventListener('resize', resize); resize();

const defs = [
 ['intensity','Intensitet',0,4,1.42,.01],
 ['height','Höjd',0,760,265,1],
 ['baseWidth','Basbredd',0,860,315,1],
 ['flameCount','Antal lågor',0,34,15,1],
 ['width','Lågbredd',0,280,92,1],
 ['spread','Spridning',0,1.8,.68,.01],
 ['turbulence','Turbulens',0,5,1.42,.01],
 ['speed','Hastighet',0,3,.74,.01],
 ['coreWhite','Core white',0,1,.35,.01],
 ['colorChaos','Färgvariation',0,2,1.02,.01],
 ['glow','Glow',0,3,1.15,.01],
 ['smoke','Rök',0,3,.35,.01],
 ['sparks','Gnistor',0,5,1.28,.01],
 ['sparkSpread','Gnistbredd',0,2.5,1.1,.01],
 ['sparkLife','Gnistliv',0,5,2.2,.01],
];
const v = Object.fromEntries(defs.map(d=>[d[0], d[4]]));
const controls = document.getElementById('controls');
for(const [id,label,min,max,val,step] of defs){
 const row=document.createElement('div'); row.className='row';
 row.innerHTML=`<label><span>${label}</span><output id="o_${id}">${val}</output></label><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${val}">`;
 controls.appendChild(row);
 const input=row.querySelector('input'); const out=row.querySelector('output');
 input.addEventListener('input',()=>{ v[id]=Number(input.value); out.textContent = Number.isInteger(Number(step)) ? String(Math.round(v[id])) : v[id].toFixed(2); });
 out.textContent = Number.isInteger(Number(step)) ? String(Math.round(val)) : Number(val).toFixed(2);
}
function setVals(obj){ for(const k in obj){ const el=document.getElementById(k); if(!el) continue; el.value=obj[k]; el.dispatchEvent(new Event('input')); }}
const presets={
 campfire:{intensity:1.42,height:265,baseWidth:315,flameCount:15,width:92,spread:.68,turbulence:1.42,speed:.74,coreWhite:.35,colorChaos:1.02,glow:1.15,smoke:.35,sparks:1.28,sparkSpread:1.1,sparkLife:2.2},
 torch:{intensity:1.35,height:380,baseWidth:108,flameCount:9,width:62,spread:.38,turbulence:1.25,speed:.86,coreWhite:.42,colorChaos:.82,glow:1.05,smoke:.18,sparks:.85,sparkSpread:.55,sparkLife:1.8},
 candle:{intensity:.82,height:145,baseWidth:26,flameCount:1,width:48,spread:0,turbulence:.42,speed:.45,coreWhite:.55,colorChaos:.35,glow:.62,smoke:.02,sparks:0,sparkSpread:.2,sparkLife:1},
 gas:{intensity:1.22,height:220,baseWidth:62,flameCount:2,width:72,spread:.16,turbulence:.38,speed:.56,coreWhite:.38,colorChaos:.25,glow:.8,smoke:0,sparks:.05,sparkSpread:.15,sparkLife:.8}
};
document.querySelectorAll('[data-preset]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('[data-preset]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');setVals(presets[btn.dataset.preset]); rebuildFlames();}));
document.getElementById('randomize').addEventListener('click', rebuildFlames);

function rand(a,b){return a+Math.random()*(b-a)}
function hash(n){return (Math.sin(n*127.1+311.7)*43758.5453123)%1}
function noise1(x){const i=Math.floor(x), f=x-i; const a=hash(i), b=hash(i+1); const u=f*f*(3-2*f); return a+(b-a)*u;}
function fbm(x){return noise1(x)*.55 + noise1(x*2.11+7)*.28 + noise1(x*4.03+19)*.17;}

let flames=[];
function rebuildFlames(){
 flames=[];
 const n=Math.max(0, Math.round(v.flameCount));
 for(let i=0;i<n;i++){
   const u=n<=1?.5:i/(n-1);
   const center=(u-.5)*v.baseWidth*v.spread;
   flames.push({
     id:Math.random()*100000,
     base:center + rand(-v.baseWidth*.025,v.baseWidth*.025),
     hMul:rand(.72,1.28),
     wMul:rand(.74,1.22),
     lean:rand(-.42,.42),
     hue:rand(-1,1),
     phase:rand(0,1000),
     pulse:rand(.55,1.35)
   });
 }
}
rebuildFlames();

class Spark{
 constructor(x,y,source){
   this.x=x; this.y=y; this.age=0;
   this.life=rand(.75,2.4)*Math.max(.15,v.sparkLife);
   this.r=rand(1.2,3.8);
   this.seed=rand(0,1000);
   this.vx=rand(-70,70)*v.sparkSpread + (source?.lean||0)*40;
   this.vy=rand(-118,-28);
   this.drift=rand(-1,1);
 }
 update(dt,t){
   this.age+=dt;
   const p=this.age/this.life;
   const turb=(fbm(this.seed+t*.42+p*5)-.5)*120;
   this.vx += turb*dt*.7;
   this.vy += -8*dt + 34*p*dt;
   this.x += this.vx*dt;
   this.y += this.vy*dt;
   return this.age < this.life;
 }
 draw(){
   const p=this.age/this.life, a=(1-p)*(1-p);
   const r=this.r*(.75+p*.75);
   const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,r*5.2);
   g.addColorStop(0,`rgba(255,236,164,${a*.95})`);
   g.addColorStop(.25,`rgba(255,138,45,${a*.42})`);
   g.addColorStop(1,'rgba(255,80,0,0)');
   ctx.fillStyle=g; ctx.beginPath(); ctx.arc(this.x,this.y,r*5.2,0,Math.PI*2); ctx.fill();
 }
}
class Smoke{
 constructor(x,y){this.x=x;this.y=y;this.age=0;this.life=rand(3.5,7);this.r=rand(36,100);this.seed=rand(0,999);this.vx=rand(-8,8);this.vy=rand(-14,-5)}
 update(dt,t){this.age+=dt;this.x+=(this.vx+(fbm(this.seed+t*.12)-.5)*18)*dt;this.y+=this.vy*dt;return this.age<this.life}
 draw(){const p=this.age/this.life;const rr=this.r*(1+p*2.1);const a=(1-p)*.055*v.smoke;const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,rr);g.addColorStop(0,`rgba(116,112,104,${a})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(this.x,this.y,rr,0,Math.PI*2);ctx.fill()}
}
const sparks=[], smokes=[];
let last=performance.now();
function drawSingleFlame(cx,cy,f,t){
 const h=v.height*f.hMul*(.92+.08*Math.sin(t*f.pulse+f.phase));
 const baseW=v.width*f.wMul;
 const layers=92;
 for(let i=0;i<layers;i++){
   const p=i/(layers-1);
   const ease=p*p*(3-2*p);
   const y=cy - p*h;
   const anchor=f.base*(1-p*.12); // lower flame keeps its source; top can lean away
   const pathFromBase=(fbm(f.phase+p*2.5+t*.18)-.5)*2;
   const pathFine=(fbm(f.phase+20+p*8+t*.33)-.5)*2;
   const side = anchor + f.lean*ease*h*.18 + pathFromBase*ease*v.turbulence*34 + pathFine*ease*ease*v.turbulence*18;
   let w=baseW*(1-p*.94);
   w*=.86 + .16*Math.sin(f.phase+t*.92+p*7) + .09*(fbm(f.phase+p*6+t*.24)-.5);
   w=Math.max(1,w);
   const hh=13+(1-p)*24;
   const body=(1-p); const edgeChaos=.85+.3*fbm(f.phase+p*9+t*.27);
   const alpha=body*.075*v.intensity*edgeChaos;
   const white=v.coreWhite*(1-p*.55)*(0.55+0.45*fbm(f.phase+80+p*6+t*.31));
   const chaos=v.colorChaos;
   const redBoost=Math.max(0, f.hue)*chaos;
   const yellowBoost=Math.max(0, -f.hue)*chaos;
   const innerA=alpha*(1.2+white*2.2);
   const g=ctx.createRadialGradient(cx+side,y,0,cx+side,y,w*1.1);
   g.addColorStop(0,`rgba(255,${Math.round(205+40*white+20*yellowBoost)},${Math.round(120+115*white)},${innerA})`);
   g.addColorStop(.22,`rgba(255,${Math.round(164+44*yellowBoost)},${Math.round(42+38*yellowBoost)},${alpha*1.45})`);
   g.addColorStop(.58,`rgba(${Math.round(246+9*redBoost)},${Math.round(76+24*yellowBoost)},${Math.round(8+12*yellowBoost)},${alpha*.9})`);
   g.addColorStop(1,'rgba(120,0,0,0)');
   ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(cx+side,y,w,hh,0,0,Math.PI*2); ctx.fill();
 }
 return {tipX:cx+f.base + f.lean*h*.12 + (fbm(f.phase+2+t*.18)-.5)*v.turbulence*42, tipY:cy-h*.82, h};
}
function drawBase(cx,cy,t){
 const bw=Math.max(v.baseWidth*.62, v.width*1.2);
 const g=ctx.createRadialGradient(cx,cy-6,0,cx,cy-8,bw*.75);
 const a=.16*v.intensity;
 g.addColorStop(0,`rgba(255,125,26,${a*.85})`);
 g.addColorStop(.35,`rgba(255,82,14,${a*.52})`);
 g.addColorStop(.72,`rgba(146,28,5,${a*.25})`);
 g.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(cx,cy,bw*.75,34+v.height*.035,0,0,Math.PI*2); ctx.fill();
}
function frame(now){
 const dt=Math.min(.033,(now-last)/1000); last=now;
 const t=now*.001*v.speed;
 ctx.globalCompositeOperation='source-over';
 ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
 const cx=W*.5, cy=H*.82;
 if(flames.length!==Math.round(v.flameCount)) rebuildFlames();
 if(v.smoke>0 && Math.random()<.035*v.smoke){ smokes.push(new Smoke(cx+rand(-v.baseWidth*.25,v.baseWidth*.25), cy-rand(25,65))); }
 for(let i=smokes.length-1;i>=0;i--){ if(!smokes[i].update(dt,t)) smokes.splice(i,1); }
 for(const s of smokes) s.draw();
 ctx.globalCompositeOperation='lighter';
 const glow=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(v.baseWidth*.75,v.width*3.2));
 glow.addColorStop(0,`rgba(255,126,30,${.095*v.glow*v.intensity})`); glow.addColorStop(1,'rgba(255,70,0,0)');
 ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(cx,cy,Math.max(v.baseWidth*.75,v.width*3.2),0,Math.PI*2); ctx.fill();
 drawBase(cx,cy,t);
 const tips=[];
 for(const f of flames) tips.push({f,...drawSingleFlame(cx,cy,f,t)});
 if(v.sparks>0 && tips.length && Math.random()<.18*v.sparks){
   const pick=tips[Math.floor(Math.random()*tips.length)];
   const spawnP=rand(.62,.96);
   const sx=pick.tipX + rand(-v.width*.18,v.width*.18)*v.sparkSpread;
   const sy=cy - pick.h*spawnP + rand(-8,18);
   sparks.push(new Spark(sx,sy,pick.f));
 }
 for(let i=sparks.length-1;i>=0;i--){ if(!sparks[i].update(dt,t)) sparks.splice(i,1); }
 for(const sp of sparks) sp.draw();
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
