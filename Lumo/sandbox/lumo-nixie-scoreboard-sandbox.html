<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lumo Nixie Scoreboard Sandbox</title>
<style>
  :root{
    --bg:#080604;
    --panel:#21160f;
    --panel2:#130d09;
    --amber:#ff9f35;
    --amber2:#ffd083;
    --dim:#5a321d;
  }
  html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 35%,#1b120d 0,#080604 58%,#030201 100%);font-family:Georgia,serif;color:#e6b36a;overflow:hidden;}
  .stage{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:28px;}
  .hud{position:relative;width:820px;height:210px;border-radius:22px;background:linear-gradient(180deg,#2a1a11,#120b07 65%,#090604);box-shadow:0 0 0 2px #4b2e1b, inset 0 0 35px #000, 0 22px 80px #000;border:1px solid #8a5428;padding:22px 28px;}
  .hud:before{content:"";position:absolute;inset:10px;border-radius:15px;border:1px solid rgba(255,168,70,.18);box-shadow:inset 0 0 24px rgba(255,150,45,.08);pointer-events:none;}
  .label{font:700 14px Arial, sans-serif;letter-spacing:2px;color:rgba(255,190,100,.55);text-shadow:0 0 7px rgba(255,120,20,.35);margin:0 0 14px 10px;}
  .scoreboard{position:relative;height:128px;border-radius:14px;background:linear-gradient(180deg,#090604,#1b0e07 45%,#050302);border:2px solid #4b2a16;box-shadow:inset 0 0 22px #000, inset 0 0 55px rgba(255,95,20,.08), 0 0 28px rgba(255,120,20,.12);display:flex;align-items:center;justify-content:center;gap:12px;overflow:hidden;}
  .scoreboard:after{content:"";position:absolute;inset:-30% -20%;background:linear-gradient(110deg,transparent 0 42%,rgba(255,210,130,.06) 47%,rgba(255,210,130,.12) 50%,rgba(255,210,130,.04) 53%,transparent 60%);transform:translateX(var(--sweep, -30%));animation:sweep 9s ease-in-out infinite;pointer-events:none;}
  @keyframes sweep{0%,20%{--sweep:-55%;}70%,100%{--sweep:55%;}}
  .tube{position:relative;width:88px;height:112px;border-radius:36px 36px 22px 22px;background:radial-gradient(ellipse at 50% 25%,rgba(255,200,120,.14),transparent 38%),linear-gradient(90deg,rgba(255,255,255,.05),transparent 18%,transparent 78%,rgba(255,255,255,.04)),linear-gradient(180deg,#22120a,#080403 75%,#020101);border:1px solid rgba(255,170,80,.25);box-shadow:inset 0 0 18px #000, inset 0 0 28px rgba(255,120,30,.10), 0 0 16px rgba(255,100,20,.08);display:flex;align-items:center;justify-content:center;}
  .tube:before{content:"";position:absolute;left:18px;right:18px;top:9px;height:10px;border-radius:50%;background:rgba(255,230,180,.12);filter:blur(2px);}
  .ghost{position:absolute;font:700 74px/1 Georgia,serif;color:rgba(255,120,35,.055);letter-spacing:-5px;text-shadow:0 0 4px rgba(255,100,20,.05);}
  .digit{position:relative;font:700 74px/1 Georgia,serif;color:#ffad45;letter-spacing:-5px;text-shadow:0 0 5px #ff6a00,0 0 16px rgba(255,115,22,.95),0 0 34px rgba(255,90,15,.55),0 0 70px rgba(255,70,0,.23);animation:flicker 3.8s infinite ease-in-out;}
  @keyframes flicker{0%,100%{opacity:.96;filter:brightness(1);}47%{opacity:.88;filter:brightness(.94);}49%{opacity:1;filter:brightness(1.12);}53%{opacity:.92;}80%{opacity:.98;}}
  .wire{position:absolute;bottom:10px;width:52px;height:1px;background:rgba(255,150,70,.20);box-shadow:0 0 6px rgba(255,120,30,.2);} 
  .buttons{display:flex;gap:12px;align-items:center;}
  button{background:#21130b;color:#f0b86a;border:1px solid #79451f;border-radius:8px;padding:10px 14px;box-shadow:inset 0 0 12px #000;cursor:pointer;font-weight:700;}button:hover{background:#2d1a0f;}
  .note{opacity:.65;font:13px Arial,sans-serif;}
</style>
</head>
<body>
<div class="stage">
  <div class="hud">
    <div class="label">SCORE</div>
    <div class="scoreboard" id="scoreboard"></div>
  </div>
  <div class="buttons">
    <button onclick="setScore(score+137)">+137</button>
    <button onclick="setScore(score+1000)">+1000</button>
    <button onclick="setScore(0)">RESET</button>
  </div>
  <div class="note">Fristående kod-demo: Nixie-scoreboard i varm sepia/amber Lumo-stil.</div>
</div>
<script>
  let score = 21151;
  const board = document.getElementById('scoreboard');
  function makeTube(n){
    const tube=document.createElement('div'); tube.className='tube';
    const ghost=document.createElement('div'); ghost.className='ghost'; ghost.textContent='8';
    const digit=document.createElement('div'); digit.className='digit'; digit.textContent=n;
    const wire=document.createElement('div'); wire.className='wire';
    tube.append(ghost,digit,wire); return tube;
  }
  function setScore(v){score=Math.max(0,Math.min(99999,Math.floor(v))); render();}
  function render(){board.innerHTML=''; String(score).padStart(5,'0').split('').forEach(d=>board.appendChild(makeTube(d)));}
  setInterval(()=>{ if(Math.random()<0.25) setScore(score+Math.floor(Math.random()*17)); }, 1400);
  render();
</script>
</body>
</html>
