<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lumo Nixie Scoreboard — True Tube Sandbox</title>
<style>
  :root {
    --bg: #120e0a;
    --panel: #24180f;
    --amber: #ff9d32;
    --amber2: #ff6d1a;
    --glass: rgba(255, 190, 95, .08);
  }

  html, body {
    margin: 0;
    height: 100%;
    background:
      radial-gradient(circle at 50% 35%, rgba(255,140,35,.09), transparent 38%),
      linear-gradient(180deg, #15100c, #070605 72%);
    color: #e8c28b;
    font-family: system-ui, Segoe UI, sans-serif;
    overflow: hidden;
  }

  .wrap {
    height: 100%;
    display: grid;
    place-items: center;
  }

  .stage {
    width: min(1120px, 96vw);
    padding: 34px;
    border-radius: 28px;
    background:
      linear-gradient(180deg, rgba(255,180,85,.07), transparent 28%),
      linear-gradient(135deg, rgba(255,255,255,.035), transparent 30%),
      #15100c;
    box-shadow:
      inset 0 0 0 1px rgba(255,180,80,.16),
      inset 0 0 42px rgba(0,0,0,.84),
      0 34px 90px rgba(0,0,0,.62);
  }

  .title {
    letter-spacing: .18em;
    font-size: 13px;
    color: rgba(255, 198, 118, .72);
    margin: 0 0 16px;
    text-transform: uppercase;
  }

  .scoreboard {
    position: relative;
    display: flex;
    gap: 14px;
    align-items: center;
    justify-content: center;
    padding: 26px 30px 30px;
    border-radius: 22px;
    background:
      radial-gradient(circle at 50% 0%, rgba(255,146,44,.12), transparent 45%),
      linear-gradient(180deg, rgba(88,54,25,.62), rgba(22,15,10,.95));
    box-shadow:
      inset 0 0 0 1px rgba(255,181,83,.22),
      inset 0 11px 25px rgba(255,196,102,.06),
      inset 0 -22px 42px rgba(0,0,0,.7),
      0 0 38px rgba(255,124,31,.08);
  }

  .scoreboard::before {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 16px;
    pointer-events: none;
    background:
      linear-gradient(110deg, transparent 8%, rgba(255,230,180,.08) 18%, transparent 31%),
      repeating-linear-gradient(90deg, transparent 0 26px, rgba(255,200,120,.025) 27px, transparent 29px);
    mix-blend-mode: screen;
    opacity: .55;
  }

  .tube {
    position: relative;
    width: 118px;
    height: 188px;
    border-radius: 54px 54px 42px 42px / 32px 32px 34px 34px;
    background:
      radial-gradient(ellipse at 38% 12%, rgba(255,240,205,.18), transparent 28%),
      radial-gradient(ellipse at 50% 56%, rgba(255,120,25,.12), transparent 48%),
      linear-gradient(90deg, rgba(255,255,255,.04), transparent 18%, transparent 82%, rgba(255,255,255,.035)),
      rgba(25, 16, 10, .72);
    box-shadow:
      inset 0 0 0 1px rgba(255,210,135,.20),
      inset 0 0 18px rgba(255,148,48,.12),
      inset 0 -26px 34px rgba(0,0,0,.58),
      0 0 18px rgba(255,114,29,.09);
    overflow: hidden;
  }

  .tube::before {
    content: "";
    position: absolute;
    inset: 10px 14px;
    border-radius: 46px;
    background:
      linear-gradient(105deg, rgba(255,255,255,.14), transparent 19%, transparent 70%, rgba(255,245,210,.055)),
      linear-gradient(180deg, rgba(255,210,135,.065), transparent 44%, rgba(0,0,0,.18));
    pointer-events: none;
    z-index: 7;
    opacity: .65;
  }

  .tube::after {
    content: "";
    position: absolute;
    left: 18px;
    right: 18px;
    bottom: 16px;
    height: 10px;
    border-radius: 50%;
    background: rgba(255,154,55,.18);
    filter: blur(7px);
    z-index: 0;
  }

  .mesh {
    position: absolute;
    inset: 15px 15px;
    border-radius: 38px;
    background-image:
      repeating-linear-gradient(90deg, rgba(255,210,145,.035) 0 1px, transparent 1px 8px),
      repeating-linear-gradient(0deg, rgba(255,210,145,.022) 0 1px, transparent 1px 9px);
    opacity: .7;
    z-index: 1;
  }

  .digit-stack {
    position: absolute;
    inset: 20px 10px 18px;
    z-index: 3;
  }

  .digit {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 118px;
    line-height: 1;
    font-weight: 500;
    transform: translateY(3px) scaleX(.86);
    color: rgba(255,124,32,.05);
    text-shadow:
      0 0 1px rgba(255,136,42,.05);
    opacity: .62;
  }

  .digit.ghost {
    color: rgba(255,116,32,.055);
    text-shadow: 0 0 6px rgba(255,116,32,.045);
    filter: blur(.15px);
  }

  .digit.active {
    color: rgba(255,157,54,.97);
    opacity: 1;
    text-shadow:
      0 0 2px rgba(255,238,190,.92),
      0 0 7px rgba(255,150,45,.90),
      0 0 18px rgba(255,94,20,.72),
      0 0 38px rgba(255,85,10,.38),
      0 0 70px rgba(255,80,10,.16);
    filter: brightness(1.08);
    animation: nixieBreath 2.7s ease-in-out infinite;
  }

  .digit.active::before {
    content: attr(data-n);
    position: absolute;
    color: rgba(255,87,18,.20);
    transform: translate(2px, 1px);
    filter: blur(3px);
    z-index: -1;
  }

  @keyframes nixieBreath {
    0%, 100% { opacity: .97; filter: brightness(1.05); }
    47% { opacity: 1; filter: brightness(1.22); }
    52% { opacity: .91; filter: brightness(.98); }
    58% { opacity: 1; filter: brightness(1.16); }
  }

  .wires {
    position: absolute;
    left: 26px;
    right: 26px;
    bottom: 8px;
    height: 25px;
    z-index: 2;
    background:
      linear-gradient(90deg, transparent 0 8%, rgba(255,154,64,.22) 9% 10%, transparent 11% 22%, rgba(255,154,64,.18) 23% 24%, transparent 25% 39%, rgba(255,154,64,.16) 40% 41%, transparent 42% 56%, rgba(255,154,64,.15) 57% 58%, transparent 59% 73%, rgba(255,154,64,.18) 74% 75%, transparent 76%);
    opacity: .75;
  }

  .base {
    position: absolute;
    left: 18px;
    right: 18px;
    bottom: -2px;
    height: 22px;
    border-radius: 7px 7px 12px 12px;
    background: linear-gradient(180deg, rgba(70,42,22,.9), rgba(16,11,8,.96));
    box-shadow: inset 0 1px rgba(255,199,120,.18);
    z-index: 8;
  }

  .controls {
    display: flex;
    gap: 14px;
    align-items: center;
    justify-content: center;
    margin-top: 20px;
    color: rgba(255,198,118,.75);
    font-size: 13px;
  }

  button {
    background: rgba(255,150,55,.12);
    color: #ffd19a;
    border: 1px solid rgba(255,180,85,.28);
    border-radius: 999px;
    padding: 9px 14px;
    cursor: pointer;
    box-shadow: inset 0 0 12px rgba(0,0,0,.35);
  }

  button:hover { background: rgba(255,150,55,.18); }

  input {
    width: 120px;
    background: rgba(0,0,0,.25);
    border: 1px solid rgba(255,180,85,.25);
    border-radius: 10px;
    color: #ffd19a;
    padding: 8px 10px;
    font: inherit;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <p class="title">LUMO / NIXIE SCOREBOARD — TRUE TUBE SANDBOX</p>
    <div id="scoreboard" class="scoreboard"></div>
    <div class="controls">
      <button id="minus">−100</button>
      <input id="scoreInput" value="001280" maxlength="6" />
      <button id="plus">+100</button>
      <button id="random">Random score</button>
    </div>
  </div>
</div>

<script>
  const board = document.getElementById("scoreboard");
  const input = document.getElementById("scoreInput");
  const DIGITS = 6;
  let score = 1280;

  function createTube(index) {
    const tube = document.createElement("div");
    tube.className = "tube";
    tube.innerHTML = `
      <div class="mesh"></div>
      <div class="digit-stack"></div>
      <div class="wires"></div>
      <div class="base"></div>
    `;
    const stack = tube.querySelector(".digit-stack");

    // Layer all numbers in each tube, like real nixie wires.
    for (let n = 9; n >= 0; n--) {
      const d = document.createElement("div");
      d.className = "digit ghost";
      d.dataset.n = String(n);
      d.textContent = String(n);
      d.style.transform = `translate(${(n - 4.5) * 0.13}px, ${3 + (n % 3) * 0.18}px) scaleX(.86)`;
      stack.appendChild(d);
    }

    return tube;
  }

  for (let i = 0; i < DIGITS; i++) board.appendChild(createTube(i));

  function setScore(value) {
    score = Math.max(0, Math.min(999999, Math.floor(value || 0)));
    const text = String(score).padStart(DIGITS, "0");
    input.value = text;

    [...board.children].forEach((tube, i) => {
      const active = text[i];
      tube.querySelectorAll(".digit").forEach(d => {
        const isActive = d.dataset.n === active;
        d.classList.toggle("active", isActive);
        d.classList.toggle("ghost", !isActive);
        d.style.animationDelay = `${-(i * 0.17)}s`;
      });
    });
  }

  document.getElementById("minus").onclick = () => setScore(score - 100);
  document.getElementById("plus").onclick = () => setScore(score + 100);
  document.getElementById("random").onclick = () => setScore(Math.floor(Math.random() * 999999));
  input.addEventListener("input", () => setScore(Number(input.value.replace(/\D/g, ""))));

  setScore(score);
</script>
</body>
</html>
